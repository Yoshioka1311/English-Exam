function add(part,topic,level,question,options,answer,explanation,extra={}){BANK.push({id:'q'+(BANK.length+1),part,topic,level,question,options,answer,explanation,...extra});}

const sentences=[

<script>
const LESSONS=[
{id:'word-forms',title:'Choose the right word form',topic:'Word forms',level:'B1',desc:'Noun, verb, adjective, or adverb?',rule:'Look at the words around the blank before reading the options. A noun often follows a determiner such as “the” or “our”. An adjective describes a noun. An adverb can describe a verb or adjective.',example:'The team completed the project <strong>successfully</strong>.',why:'The blank describes how the team completed the project, so it needs an adverb. Compare: a successful project, the success of the project, and succeed in a project.',trap:'A word can look familiar and still be the wrong grammatical form. Identify the job of the blank first.',thai:'ดูหน้าที่ของคำในช่องว่างก่อน เช่น adjective ขยายคำนาม ส่วน adverb ขยายกริยาหรือ adjective ในตัวอย่าง successfully ขยาย completed จึงต้องใช้ adverb'},
{id:'tenses',title:'Put events on a timeline',topic:'Tenses',level:'B1',desc:'Present perfect, past perfect, and time markers.',rule:'Use the past simple for a finished event at a finished time. Use the present perfect for an event connected to now, often with “since” or “for”. Use the past perfect for the earlier of two past events.',example:'By the time the guests arrived, we <strong>had prepared</strong> the room.',why:'Preparation happened first. The guests arrived second. Past perfect makes that order clear. “Since 2021” marks a starting point; “for five years” marks a duration.',trap:'Do not choose a tense from one time word alone. Check when each action happens and whether the time period is finished.',thai:'เรียงเหตุการณ์ก่อนหลัง ถ้าพูดถึงอดีตสองเหตุการณ์ เหตุการณ์ที่เกิดก่อนอาจใช้ had + V3 ส่วน since ตามด้วยจุดเริ่มต้น เช่น since 2021 และ for ตามด้วยระยะเวลา เช่น for five years'},
{id:'agreement',title:'Find the real subject',topic:'Agreement',level:'B1',desc:'Each, collective nouns, and neither … nor.',rule:'The main subject determines the verb. Extra phrases between the subject and verb do not change the subject’s number. “Each” takes a singular verb. With “neither … nor”, standard agreement follows the nearer subject.',example:'Each of the applicants <strong>is</strong> required to attend.',why:'The subject is “each”, not “applicants”. Similarly, “The policy, along with the forms, is available” has a singular main subject.',trap:'The nearest noun is not always the subject. Remove interrupting phrases to check the basic sentence.',thai:'หาประธานหลัก อย่าเลือกกริยาตามคำนามที่อยู่ใกล้ที่สุดเสมอไป Each เป็นเอกพจน์ จึงใช้ is แม้จะมี of the applicants ตามมา'},
{id:'connectors',title:'Connect ideas accurately',topic:'Linking words',level:'B2',desc:'Contrast, cause, and clause structure.',rule:'“Although” and “because” introduce clauses with a subject and a verb. “Despite” and “because of” introduce noun phrases or -ing forms. Choose both the intended meaning and the correct structure.',example:'<strong>Although</strong> it rained, the event continued.<br><strong>Despite</strong> the rain, the event continued.',why:'“It rained” is a full clause. “The rain” is a noun phrase. Both sentences express the same contrast through different structures.',trap:'Do not use “despite of”. The correct patterns are “despite” and “in spite of”.',thai:'Although ตามด้วยประโยคที่มีประธานและกริยา ส่วน despite ตามด้วยคำนามหรือ V-ing เช่น Although it rained กับ Despite the rain มีความหมายใกล้กัน แต่ใช้โครงสร้างต่างกัน'},
{id:'passive',title:'Recognize the passive voice',topic:'Passive voice',level:'B2',desc:'When the subject receives the action.',rule:'Use a form of “be” plus a past participle when the subject receives an action. Preserve the tense: is reviewed, was reviewed, will be reviewed, or is being reviewed.',example:'The proposal <strong>is being reviewed</strong> by the legal team.',why:'The proposal does not review anything. Someone is reviewing it now, so the present continuous passive is appropriate.',trap:'“Is reviewing” would make the proposal the person or thing doing the reviewing.',thai:'ถ้าประธานเป็นผู้ถูกกระทำ ใช้ be + V3 เช่น proposal ถูกตรวจอยู่ตอนนี้ จึงใช้ is being reviewed โดยรูปของ be จะเปลี่ยนตาม tense'},
{id:'conditionals',title:'Read conditions and consequences',topic:'Conditionals',level:'B2',desc:'Real conditions and unreal past situations.',rule:'Use if + present with will for a real future possibility. Use if + past perfect with would have + past participle to imagine a different past. “Provided that” means “only if”.',example:'If we <strong>had received</strong> the order earlier, we <strong>would have shipped</strong> it yesterday.',why:'The order did not arrive earlier, and the shipment did not happen yesterday. This is an unreal past condition.',trap:'“Unless” means “if not”. Replacing “provided that” with “unless” reverses the condition.',thai:'Third conditional ใช้พูดถึงอดีตที่ไม่ได้เกิดขึ้นจริง รูปคือ If + had + V3 คู่กับ would have + V3 ส่วน provided that หมายถึง โดยมีเงื่อนไขว่า'},
{id:'verb-patterns',title:'Learn the verb with its pattern',topic:'Verb patterns',level:'B2',desc:'To-infinitives, -ing forms, and causatives.',rule:'Learn common verbs as patterns. “Encourage someone to do something” uses a to-infinitive. “Refrain from doing” uses -ing. Causative “have someone do something” uses a bare infinitive.',example:'The director had her assistant <strong>distribute</strong> the agenda.',why:'After causative “had” + a person, use the base verb. Compare “The agenda was distributed”, which is passive.',trap:'“Regret to inform” introduces bad news. “Regret informing” means feeling sorry about having informed someone earlier.',thai:'จำกริยาพร้อมโครงสร้าง เช่น encourage someone to do แต่ have someone do ใช้กริยารูปพื้นฐาน ไม่ต้องมี to ส่วน regret to inform ใช้เกริ่นแจ้งข่าวที่ไม่ดี'},
{id:'collocations',title:'Learn words that belong together',topic:'Collocations',level:'B1',desc:'Take effect, make arrangements, compatible with.',rule:'A collocation is a combination that English speakers commonly use. Learn a short phrase rather than an isolated translation: take effect, meet a deadline, make arrangements, and comply with a policy.',example:'The new policy will <strong>take effect</strong> on Monday.',why:'“Take effect” means begin to apply. “Make arrangements” means organize practical details. Prepositions are part of many useful combinations.',trap:'A direct translation from Thai may produce the wrong verb or preposition. Remember the whole phrase.',thai:'เรียนศัพท์เป็นกลุ่มคำ เช่น take effect = เริ่มมีผลบังคับใช้, make arrangements = จัดเตรียม และ compatible with = ใช้งานร่วมกันได้ ไม่ควรแปลแยกทีละคำแล้วเดาคำที่ใช้คู่กัน'},
{id:'inversion',title:'Handle advanced sentence patterns',topic:'Inversion',level:'B2+',desc:'Not only, inverted conditionals, and formal recommendations.',rule:'When “not only” starts a clause, invert the subject and auxiliary or “be”. “Had I known” means “If I had known”. After “recommend that”, formal English may use the base verb, including “be”.',example:'<strong>Not only is</strong> the price competitive, but delivery is also free.',why:'“The price is competitive” becomes “is the price competitive” after fronted “not only”. In “recommend that it be revised”, “be” is a formal subjunctive.',trap:'Inversion changes the order, not the underlying time or meaning. Identify the ordinary sentence first.',thai:'เมื่อ Not only ขึ้นต้น clause ต้องสลับกริยาช่วยกับประธาน เช่น Not only is the price… ส่วน Had I known = If I had known และ recommend that … be เป็นโครงสร้างทางการ'},
{id:'reading',title:'Find evidence, then choose',topic:'Comprehension',level:'B2',desc:'Purpose, detail, and inference questions.',rule:'Identify the document’s purpose and the sender’s relationship to the reader. For a detail question, locate the exact evidence. For inference, connect evidence without adding facts that the text does not support.',example:'“The room is available at 15:00. I arrive at noon. Can you store my bags?”',why:'The guest arrives before check-in and needs luggage storage. Nothing says that early room access has been approved.',trap:'An option can be true in everyday life and still be unsupported by the passage. Watch dates, conditions, exceptions, and who pays.',thai:'ตอบจากหลักฐานในบทอ่าน ไม่ใช่จากสิ่งที่น่าจะเกิดขึ้นทั่วไป ข้อ inference ต้องอนุมานได้จากข้อมูลที่มี และระวังวันเวลา เงื่อนไข ข้อยกเว้น และผู้รับผิดชอบค่าใช้จ่าย'},
{id:'multi-text',title:'Connect information across texts',topic:'Comprehension',level:'B2+',desc:'Emails, schedules, invoices, and changing plans.',rule:'Read the question and identify which texts contain the needed facts. A later reply can change an earlier price or arrangement. Combine timetable information with travel or setup time.',example:'Arrival: 08:45. Walk: 20 minutes. Registration closes: 09:00.',why:'The arrival at the venue would be 09:05, which is too late. The train’s arrival time alone is not enough.',trap:'For totals, include only requested extras. If a fee is waived, it becomes zero. Recalculate after discounts rather than using the original quote.',thai:'ข้อหลายเอกสารต้องเชื่อมข้อมูล เช่น รถไฟถึง 08:45 แต่ต้องเดินอีก 20 นาที จะถึง 09:05 จึงไม่ทันลงทะเบียนที่ปิด 09:00 และต้องใช้ราคาหรือเงื่อนไขฉบับล่าสุดในการคำนวณ'},
{id:'listening',title:'Listen for meaning, not matching words',topic:'Listening response',level:'B1',desc:'Indirect answers, intent, and paraphrases.',rule:'For short responses, identify the question’s purpose: time, place, person, reason, offer, or request. A natural reply may be indirect. For longer recordings, predict the type of information each question needs.',example:'“Have you finished the report?”<br>“I still have two pages to check.”',why:'The reply means “not yet” without saying “no”. Similar-sounding words in a distractor do not make it relevant.',trap:'A response may repeat a word from the question but answer something completely different. Listen to the full relationship.',thai:'จับเจตนาของคำถาม เช่น ถามเวลา สถานที่ หรือขอความช่วยเหลือ คำตอบไม่จำเป็นต้องตอบตรง ๆ เช่น ยังเหลือสองหน้าให้ตรวจ หมายถึงยังทำไม่เสร็จ อย่าเลือกเพียงเพราะได้ยินคำซ้ำ'}

"#526c55"/><path d="M264 70v97" stroke="#dce6d4"/><path d="M35 180h410" stroke="#bda078" stroke-width="6"/><circle cx="153" cy="151" r="15" fill="#ccab86"/><path d="M140 169h27v31h-27z" fill="#526c55"/><path d="M146 200v29m15-29v29" stroke="#526c55" stroke-width="8"/><circle cx="340" cy="150" r="15" fill="#ccab86"/><path d="M327 167h27v34h-27z" fill="#9c956b"/><path d="M332 201v28m16-28v28" stroke="#526c55" stroke-width="8"/><rect x="365" y="192" width="24" height="32" rx="3" fill="#718970"/>',warehouse:'<path d="M45 36v180m0-120h175M45 157h175M220 36v180" stroke="#718970" stroke-width="7"/><g fill="#c8b28d" stroke="#b39d78"><rect x="60" y="50" width="54" height="43"/><rect x="130" y="49" width="68" height="44"/><rect x="64" y="114" width="84" height="40"/><rect x="170" y="114" width="31" height="40"/></g><circle cx="281" cy="89" r="19" fill="#ccab86"/><path d="M263 113h37l7 54h-49z" fill="#8b9e69"/><path d="m270 168-11 48m36-48 15 48" stroke="#526c55" stroke-width="12"/><path d="m295 120 35 26" stroke="#ccab86" stroke-width="12"/><path d="M324 142v55h105" stroke="#718970" stroke-width="6" fill="none"/><rect x="345" y="145" width="66" height="48" fill="#c8b28d"/><path d="M377 145v48" stroke="#b39d78"/><circle cx="346" cy="209" r="9" fill="#526c55"/><circle cx="419" cy="209" r="9" fill="#526c55"/>',meeting:'<rect x="140" y="30" width="200" height="70" rx="5" fill="#d1dfca"/><path d="M170 75h33l20-22 28 9 44-21" stroke="#718970" stroke-width="4" fill="none"/><ellipse cx="244" cy="165" rx="150" ry="26" fill="#b8aa86"/><path d="M168 185v31m150-31v31" stroke="#9e9272" stroke-width="9"/><circle cx="114" cy="117" r="18" fill="#ccab86"/><path d="M96 139h36v30H96z" fill="#718970"/><circle cx="242" cy="114" r="18" fill="#ccab86"/><path d="M224 135h36v23h-36z" fill="#9c956b"/><circle cx="371" cy="118" r="18" fill="#ccab86"/><path d="M352 140h38v30h-38z" fill="#526c55"/><rect x="215" y="163" width="37" height="17" fill="#fffef9"/><path d="M105 167v30h30m220 0h30v-30" stroke="#718970" stroke-width="8" fill="none"/>',park:'<path d="M35 218q210-55 410 0" stroke="#d3c5a7" stroke-width="25" fill="none"/><path d="M90 95v120m303-120v120" stroke="#9e9272" stroke-width="10"/><circle cx="90" cy="72" r="51" fill="#b5c5a0"/><circle cx="394" cy="73" r="49" fill="#a6b894"/><path d="M180 160h155m-155 18h155m-140-36v62m125-62v62" stroke="#9e9272" stroke-width="9"/><circle cx="245" cy="112" r="19" fill="#ccab86"/><path d="M226 137h37v37h-37z" fill="#718970"/><path d="m245 179 13 29h31" stroke="#526c55" stroke-width="11" fill="none"/>'};const labels={office:'A woman seated at an office desk, using a computer.',cafe:'A café with a standing server carrying a tray and a seated customer.',station:'Passengers standing on a station platform beside a train.',warehouse:'A warehouse worker pushing a cart carrying boxes.',meeting:'Three people seated around a table in a meeting room.',park:'A person seated on a bench among trees in a park.'};return '<div class="scene"><svg role="img" aria-label="'+labels[name]+'" viewBox="0 0 480 260">'+common+shapes[name]+'</svg></div>';}
function renderSession(){const s=state.active;if(!s){main.innerHTML=heading('Ready for a fresh start?')+'<a class="btn primary" href="#practice">Choose a practice set '+icon('arrow')+'</a>';return;}const q=BY_ID[s.ids[s.index]],selected=s.answers[q.id],checked=!!s.recorded[q.id],indices=allowed(s),atEnd=s.index===indices[indices.length-1];const order=s.orders[q.id];main.innerHTML='<div class="session-top"><div><div class="eyebrow muted" style="margin-bottom:6px">'+(s.timed?'TIMED TEST':'PRACTICE MODE')+(s.kind==='full'?' · '+s.phase.toUpperCase():'')+'</div><h1>'+esc(s.name)+'</h1></div><div class="row">'+(s.timed?'<span class="timer" id="timer" role="timer" aria-label="Time remaining"></span>':'<span class="pill">UNTIMED</span>')+'</div></div><div class="progress-track" aria-label="'+Object.keys(s.answers).length+' answered out of '+s.ids.length+'"><span style="width:'+(Object.keys(s.answers).length/s.ids.length*100)+'%"></span></div><div class="question-shell"><section class="card question-card" aria-labelledby="question-text"><div class="row between wrap qnumber"><span>QUESTION '+(s.index+1)+' / '+s.ids.length+' · '+(q.id.startsWith('v')?'VOCABULARY':'PART '+q.part)+'</span><span class="pill">'+q.level+' · '+esc(q.topic)+'</span></div>'+(q.passage?'<div class="source"><h3>'+esc(q.title)+'</h3>'+esc(q.passage)+'</div>':'')+(q.scene?scene(q.scene):'')+(q.audio?audioPanel():'')+'<h2 class="question" id="question-text">'+esc(q.question)+'</h2><div class="answers" role="radiogroup" aria-label="Answer options">'+order.map((j,i)=>'<button class="answer '+(checked&&j===q.answer?'correct':checked&&selected===j?'incorrect':'')+'" role="radio" aria-checked="'+(selected===j)+'" data-action="answer" data-index="'+j+'" '+(checked?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(q.options[j])+'</span>'+(checked&&j===q.answer?'<span style="margin-left:auto">'+icon('check')+'</span>':'')+'</button>').join('')+'</div>'+(checked?feedback(q,selected):'')+'<div class="question-actions"><div class="row"><button class="btn ghost" data-action="previous" '+(s.index===indices[0]?'disabled':'')+'>← Back</button><button class="btn ghost" data-action="flag" aria-pressed="'+s.flags.includes(q.id)+'" aria-label="'+(s.flags.includes(q.id)?'Remove flag':'Flag question for review')+'">'+icon('flag')+(s.flags.includes(q.id)?'Flagged':'Flag')+'</button></div>'+(!s.timed&&!checked?'<button class="btn primary" data-action="check" '+(selected===undefined?'disabled':'')+'>Check answer '+icon('check')+'</button>':'<button class="btn primary" data-action="next">'+(atEnd?(s.kind==='full'&&s.phase==='listening'?'Finish listening section':'Finish session'):'Next question')+icon('arrow')+'</button>')+'</div></section><aside class="card question-map" aria-label="Question navigation"><h3>YOUR QUESTIONS</h3><div class="map-grid">'+indices.map(i=>'<button class="'+(s.index===i?'current ':'')+(s.answers[s.ids[i]]!==undefined?'done ':'')+(s.flags.includes(s.ids[i])?'flagged':'')+'" data-action="jump" data-index="'+i+'" aria-label="Question '+(i+1)+(s.answers[s.ids[i]]!==undefined?', answered':', unanswered')+(s.flags.includes(s.ids[i])?', flagged':'')+'" '+(i===s.index?'aria-current="step"':'')+'>'+(i+1)+'</button>').join('')+'</div><p class="legend">Filled = answered<br>Underline = flagged</p>'+(s.timed?'<button class="btn ghost small" style="width:100%;font-size:11px" data-action="submit">'+(s.kind==='full'&&s.phase==='listening'?'Finish listening':'Submit test')+'</button>':'<button class="btn ghost small" style="width:100%;font-size:11px" data-action="submit">Finish practice</button>')+'</aside></div>';updateTimer();}
function otherOptionReasons(q,selected){const remaining=q.options.map((_,i)=>i).filter(i=>i!==q.answer&&i!==selected);return remaining.length?'<details class="other-choice-details"><summary>Why the other options do not fit</summary><ul class="other-options">'+remaining.map(i=>'<li><strong>“'+esc(spokenOption(q,i))+'”</strong><p>'+esc(distractorReason(q,i))+'</p></li>').join('')+'</ul></details>':'';}
function chosenAnswerReason(q,selected){if(selected===q.answer)return '';if(selected===null||selected===undefined)return '<p class="small muted">No answer was selected for this question.</p>';return '<div class="choice-explanation"><h4>Why your answer does not fit</h4><p>'+esc(distractorReason(q,selected))+'</p></div>';}
function correctAnswerReason(q,selected){return selected!==null&&selected!==undefined&&selected!==q.answer&&distractorReason(q,selected).includes(q.explanation)?'':'<p class="correct-choice-reason">'+esc(q.explanation)+'</p>';}
function feedback(q,selected){const right=selected===q.answer;return '<section class="feedback '+(right?'':'wrong')+'" role="status"><h3>'+(right?'Correct.':'Correct answer: '+esc(spokenOption(q,q.answer)))+'</h3>'+(!right?'<p class="small">Your answer: “'+esc(spokenOption(q,selected))+'”</p>':'')+chosenAnswerReason(q,selected)+correctAnswerReason(q,selected)+(q.thai?'<p lang="th" class="thai" style="margin-top:10px">'+esc(q.thai)+'</p>':'')+otherOptionReasons(q,selected)+(q.audio?'<details style="margin-top:15px"><summary>Read transcript</summary><p style="margin-top:12px">'+esc(q.audio)+'</p></details>':'')+'</section>';}
function answer(index){stopAudio();const s=state.active;if(!s)return;const q=BY_ID[s.ids[s.index]];if(s.recorded[q.id])return;s.answers[q.id]=index;save();renderSession();const button=main.querySelector('[data-action="answer"][data-index="'+index+'"]');if(button)button.focus({preventScroll:true});}
function checkAnswer(){const s=state.active;if(!s||s.timed)return;const q=BY_ID[s.ids[s.index]];if(s.answers[q.id]===undefined||s.recorded[q.id])return;record(q,s.answers[q.id]);s.recorded[q.id]=true;save();renderSession();const feedbackNode=main.querySelector('.feedback');feedbackNode.setAttribute('tabindex','-1');feedbackNode.focus({preventScroll:true});nav();}
function jump(index){const s=state.active;if(!s||!allowed(s).includes(index))return;stopAudio();s.index=index;save();renderSession();main.querySelector('#question-text').setAttribute('tabindex','-1');main.querySelector('#question-text').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function next(){const s=state.active;if(!s)return;const list=allowed(s),pos=list.indexOf(s.index);if(pos<list.length-1)jump(list[pos+1]);else askSubmit();}
function askSubmit(){const s=state.active;if(!s)return;const total=allowed(s);const unanswered=total.filter(i=>s.answers[s.ids[i]]===undefined).length;const unreviewed=!s.timed?total.filter(i=>s.answers[s.ids[i]]!==undefined&&!s.recorded[s.ids[i]]).length:0;if(s.kind==='full'&&s.phase==='listening'){confirmAction('Move to Reading?','Listening answers will be locked. '+unanswered+' listening questions are unanswered. Reading has its own 75-minute timer.',()=>readingPhase(),'Begin Reading');return;}confirmAction(s.timed?'Submit this test?':'Finish this practice?',unanswered+' questions unanswered.'+(unreviewed?' '+unreviewed+' selected answers have not been checked and will be scored.':'')+' Unanswered questions in this set count as incorrect.',()=>finish(),'Show results');}
function readingPhase(auto=false){const s=state.active;if(!s)return;const old=s.deadline;s.phase='reading';s.index=s.ids.findIndex(id=>BY_ID[id].part>=5);s.deadline=(auto?old:Date.now())+75*60000;stopAudio();save();if(route==='session')renderSession();toast('Listening is locked. Your 75-minute Reading section has started.');}
function finish(auto=false){const s=state.active;if(!s)return;stopAudio();s.ids.forEach(id=>{if(!s.recorded[id]){record(BY_ID[id],s.answers[id]??null);s.recorded[id]=true;}});s.ended=Date.now();s.auto=auto;s.correct=s.ids.filter(id=>s.answers[id]===BY_ID[id].answer).length;s.unanswered=s.ids.filter(id=>s.answers[id]===undefined).length;state.history.unshift({name:s.name,date:s.ended,correct:s.correct,total:s.ids.length,duration:s.ended-s.start,kind:s.kind});state.history=state.history.slice(0,50);state.result=s;state.active=null;save();go('#result');}
function updateTimer(){const s=state.active,node=document.getElementById('timer');if(!s||!s.timed||!node)return;const secs=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));node.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');node.classList.toggle('urgent',secs<300);}
setInterval(tick,250);
function breakdown(ids,answers,by='part'){const keys=[...new Set(ids.map(id=>by==='part'?BY_ID[id].part:BY_ID[id].topic))];return keys.map(key=>{const list=ids.filter(id=>(by==='part'?BY_ID[id].part:BY_ID[id].topic)===key);return{label:by==='part'?'Part '+key:key,correct:list.filter(id=>answers[id]===BY_ID[id].answer).length,total:list.length};});}
function bars(items){return '<div class="score-breakdown">'+items.map(x=>'<div class="break-row"><span>'+esc(x.label)+'</span><div class="bar" aria-hidden="true"><span style="width:'+(x.correct/x.total*100)+'%"></span></div><span>'+x.correct+'/'+x.total+'</span></div>').join('')+'</div>';}
function reviewItem(q,answer){return '<article class="review-item"><div class="row between wrap"><span class="eyebrow muted">'+(q.id.startsWith('v')?'VOCABULARY':'PART '+q.part)+' · '+esc(q.topic)+'</span><span class="pill">'+q.level+'</span></div><h3>'+esc(q.question)+'</h3><p><span class="muted">Your answer:</span> '+(answer===null||answer===undefined?'Unanswered':esc(spokenOption(q,answer)))+'</p><p><strong>Correct answer:</strong> '+esc(spokenOption(q,q.answer))+'</p>'+chosenAnswerReason(q,answer)+correctAnswerReason(q,answer)+otherOptionReasons(q,answer)+'<details class="source-details"><summary>'+(q.audio?'Read transcript':q.passage?'Read source text':'Review the rule')+'</summary>'+(q.passage?'<div class="source">'+esc(q.passage)+'</div>':q.audio?'<p>'+esc(q.audio)+'</p>':'<p>'+esc(q.explanation)+'</p>')+(q.thai?'<p lang="th" class="thai">'+esc(q.thai)+'</p>':'')+(q.scene?scene(q.scene):'')+'</details></article>';}
function renderResult(){const s=state.result;if(!s){main.innerHTML=heading('No results yet.','Complete a session to see your results.')+'<a class="btn primary" href="#practice">Start practice</a>';return;}const wrong=s.ids.filter(id=>s.answers[id]!==BY_ID[id].answer);const weak=breakdown(s.ids,s.answers,'topic').sort((a,b)=>a.correct/a.total-b.correct/b.total).slice(0,3);main.innerHTML=heading('Your session, reviewed.',esc(s.name)+(s.auto?' · Time expired':''))+'<div class="grid two"><section class="card score-card"><span class="eyebrow muted">RAW PRACTICE SCORE</span><div class="score-value">'+s.correct+'<span style="font-size:30px;color:var(--muted)"> / '+s.ids.length+'</span></div><p>'+Math.round(s.correct/s.ids.length*100)+'% correct · '+s.unanswered+' unanswered</p><p>This score is not an official TOEIC scaled score.</p><div class="row wrap" style="justify-content:center"><a class="btn primary" href="#practice">Keep practicing '+icon('arrow')+'</a>'+(wrong.length?'<button class="btn" data-action="retry-result">Retry mistakes</button>':'')+'</div></section><section class="card"><h2>By exam part</h2>'+bars(breakdown(s.ids,s.answers))+'<h3 style="font-size:14px;margin-top:25px">Suggested next practice</h3><p class="small muted">'+weak.map(x=>esc(x.label)+' ('+x.correct+'/'+x.total+')').join(' · ')+'</p></section></div><div class="section-head"><h2>'+(wrong.length?'Answers to revisit':'All answers correct')+'</h2><span class="tag">'+wrong.length+' questions</span></div><section class="card">'+(wrong.length?wrong.map(id=>reviewItem(BY_ID[id],s.answers[id])).join(''):'<p>You answered every question correctly. Try another skill or a timed test.</p>')+'</section><details class="card" style="margin-top:20px"><summary style="cursor:pointer">All answers and explanations</summary>'+s.ids.map(id=>reviewItem(BY_ID[id],s.answers[id])).join('')+'</details>';}
function renderReview(){const ids=state.misses;main.innerHTML=heading('Make the tricky ones stick.','Questions stay here until you answer them correctly.',''+ids.length+' to revisit')+(ids.length?'<div class="row wrap" style="margin:22px 0"><button class="btn primary" data-action="retry-misses">Practice mistakes '+icon('arrow')+'</button><span class="small muted">Up to 15 questions · immediate feedback</span></div><section class="card">'+ids.map(id=>reviewItem(BY_ID[id],state.stats[id]?.last)).join('')+'</section>':'<section class="card empty">'+icon('leaf')+'<h2>A fresh page.</h2><p>Any questions you miss will appear here.</p><a class="btn primary" href="#practice">Start a practice set '+icon('arrow')+'</a></section>');}
function renderProgress(){const s=stats();const topics=[...new Set(Object.keys(state.stats).filter(id=>state.stats[id].tries>0).map(id=>BY_ID[id]?.topic).filter(Boolean))].map(t=>{const a=Object.entries(state.stats).filter(([id])=>BY_ID[id]?.topic===t).map(([,v])=>v);return{label:t,correct:a.reduce((n,x)=>n+x.correct,0),total:a.reduce((n,x)=>n+x.tries,0)};});main.innerHTML=heading('See what is changing.','Your answers and study activity on this device.')+'<div class="grid three">'+[[s.unique,'Unique questions practiced'],[s.accuracy===null?'—':s.accuracy+'%','Accuracy across all attempts'],[state.known.length+' / '+WORDS.length,'Words marked remembered']].map(([v,l])=>'<div class="card"><div class="serif" style="font-size:39px">'+v+'</div><span class="small muted">'+l+'</span></div>').join('')+'</div><div class="section-head"><h2>Accuracy by skill</h2></div><section class="card">'+(topics.length?bars(topics):'<p class="muted small">Your skill breakdown appears after you answer some questions.</p>')+'</section><div class="section-head"><h2>Recent sessions</h2><button class="btn ghost" style="font-size:12px" data-action="export">Export progress</button></div><section class="card table-wrap">'+(state.history.length?'<table><thead><tr><th>SESSION</th><th>DATE</th><th>RAW SCORE</th><th>TIME</th></tr></thead><tbody>'+state.history.map(h=>'<tr><td>'+esc(h.name)+'</td><td>'+new Date(h.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</td><td>'+h.correct+' / '+h.total+'</td><td>'+Math.floor(h.duration/60000)+'m '+Math.floor(h.duration/1000)%60+'s</td></tr>').join('')+'</tbody></table>':'<p class="muted small">Finish a practice set or test to add a session here.</p>')+'</section><div class="row between wrap" style="margin-top:25px"><span class="small muted">'+state.learned.length+' / '+LESSONS.length+' lessons marked as read · '+state.days.length+' study days</span><button data-action="reset" class="btn ghost" style="font-size:12px;color:var(--red)">Reset progress</button></div>';}

function groupedSample(pool,target){const blocks=[];const seen=new Set();for(const q of shuffle(pool)){const key=q.group||q.id;if(seen.has(key))continue;seen.add(key);blocks.push(pool.filter(x=>(x.group||x.id)===key));}const sums=new Map([[0,[]]]);for(const b of blocks){for(const [n,qs] of [...sums.entries()]){const total=n+b.length;if(total<=target&&!sums.has(total))sums.set(total,[...qs,...b]);}if(sums.has(target))return sums.get(target);}return sums.get(Math.max(...sums.keys()));}

function listeningPlan(set){const blocks=[];set.filter(q=>q.part<5).forEach(q=>{const key=q.group||q.id;let b=blocks.find(x=>x.key===key);if(!b){b={key,ids:[],part:q.part,audio:q.audio,first:set.indexOf(q)};blocks.push(b);}b.ids.push(q.id);});const total=blocks.reduce((n,b)=>n+Math.max(15,b.audio.split(/\s+/).length/2.2)+b.ids.length*10,0);let elapsed=0;return blocks.map((b,i)=>{const weight=Math.max(15,b.audio.split(/\s+/).length/2.2)+b.ids.length*10;const start=elapsed;elapsed+=weight/total*2700000;return {...b,from:Math.round(start),until:i===blocks.length-1?2700000:Math.round(elapsed)};});}

function renderListeningExam(){const s=state.active,b=s.plan[s.track],first=BY_ID[b.ids[0]],done=s.audioPlayed[s.track]==='done',resume=s.audioPlayed[s.track]==='playing'&&!examUtterance;main.innerHTML=examHeader(s)+'<section class="exam-listening"><div class="row between qnumber"><span>Part '+b.part+' · '+PARTS[b.part]+'</span><span>'+(s.track+1)+' / '+s.plan.length+' recordings</span></div>'+(s.audioBlocked?'<div class="exam-alert"><p>Audio could not play. The exam timer is paused until you retry. Check your device’s English voice and volume.</p><button data-action="retry-exam-audio">Retry audio</button></div>':'')+'<div class="exam-track">'+icon('headphones')+'<span id="exam-audio-label">'+(done?'Choose your answer'+(b.ids.length>1?'s':''):resume?'Resume the current recording':'Listening…')+'</span><span class="cue" id="exam-cue"></span></div>'+(resume&&!s.audioBlocked?'<button class="btn" data-action="retry-exam-audio" style="margin-bottom:20px">Resume recording</button>':'')+'<div class="card question-card">'+(first.scene?scene(first.scene):'')+b.ids.map(id=>{const q=BY_ID[id];return '<section class="exam-question"><div class="qnumber">Question '+(s.ids.indexOf(id)+1)+'</div><h2 class="question">'+esc(q.question)+'</h2>'+questionOptions(q,s)+'</section>';}).join('')+'</div><p class="exam-remain">Audio plays once. This page advances automatically.</p></section>';updateTimer();updateExamCue();if(!s.audioPlayed[s.track]&&!s.audioBlocked)queueMicrotask(()=>playExamTrack());}
function updateExamCue(){const s=state.active,n=document.getElementById('exam-cue');if(!n||!s?.strict||s.phase!=='listening')return;const at=s.audioBlocked?s.blockedAt:Date.now();const sec=Math.max(0,Math.ceil((s.listenStart+s.plan[s.track].until-at)/1000));n.textContent=s.audioBlocked?'Paused':'Next in '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function playExamTrack(retry=false){const s=state.active;if(!s?.strict||s.phase!=='listening'||route!=='session')return;if(s.audioPlayed[s.track]&&!retry)return;stopAudio();if(s.audioBlocked){const paused=Date.now()-s.blockedAt;s.listenStart+=paused;s.deadline+=paused;s.examEnd+=paused;s.audioBlocked=false;s.blockedAt=null;}const token=examSpeechToken,b=s.plan[s.track],track=s.track;const u=new SpeechSynthesisUtterance(''+b.audio);const voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));const v=voices.find(v=>v.localService)||voices[0];if(v)u.voice=v;u.lang=v?.lang||'en-US';u.rate=1;examUtterance=u;s.audioPlayed[track]='playing';u.onstart=()=>{const label=document.getElementById('exam-audio-label');if(label)label.textContent='Listening…';};u.onend=()=>{if(token!==examSpeechToken||state.active!==s)return;examUtterance=null;s.audioPlayed[track]='done';save();const label=document.getElementById('exam-audio-label');if(label)label.textContent='Choose your answer'+(b.ids.length>1?'s':'');};u.onerror=e=>{if(token!==examSpeechToken||state.active!==s||['canceled','interrupted'].includes(e.error))return;examUtterance=null;s.audioBlocked=true;s.blockedAt=Date.now();delete s.audioPlayed[track];save();renderListeningExam();};save();if(retry)renderListeningExam();speechSynthesis.speak(u);}
function soundCheck(){stopAudio();const status=document.getElementById('sound-status');if(!('speechSynthesis'in window)){status.textContent='Speech is unavailable. Try Edge or Chrome with an English voice installed.';return;}status.textContent='Playing sample…';const u=new SpeechSynthesisUtterance('Welcome to your English practice exam. Please check that you can hear this sentence clearly.');u.lang='en-US';const v=speechSynthesis.getVoices().find(v=>/^en[-_]/i.test(v.lang)&&v.localService);if(v)u.voice=v;u.onstart=()=>{audioChecked=true;const c=document.getElementById('audio-confirm');if(c)c.disabled=false;};u.onend=()=>{if(status.isConnected)status.textContent='Sample finished. Confirm below if you heard it clearly.';};u.onerror=e=>{if(['canceled','interrupted'].includes(e.error))return;audioChecked=false;status.textContent='Audio could not play. Check your English voice settings or try another browser.';document.getElementById('audio-confirm').disabled=true;document.getElementById('exam-start').disabled=true;};speechSynthesis.speak(u);}
function readingPhase(auto=false){const s=state.active;if(!s)return;if(s.strict&&!auto&&Date.now()<s.deadline){toast('Reading begins when the 45-minute Listening section ends.');return;}const old=s.deadline;s.phase='reading';s.index=s.ids.findIndex(id=>BY_ID[id].part>=5);s.deadline=s.strict?s.examEnd:(auto?old:Date.now())+75*60000;stopAudio();save();if(route==='session')renderSession();toast('Listening finished. Reading: 75 minutes.');}
function askSubmit(){const s=state.active;if(!s)return;if(s.strict&&s.phase==='listening'){toast('Listening advances automatically until the section ends.');return;}const unanswered=allowed(s).filter(i=>s.answers[s.ids[i]]===undefined).length;confirmAction(s.kind==='full'?'Submit your exam?':'Finish this session?',unanswered+' questions in this section are unanswered and will count as incorrect. You can review explanations after submitting.',()=>finish(),'Show results');}
function updateTimer(){const s=state.active,n=document.getElementById('timer');if(!s?.timed||!n)return;const at=s.audioBlocked?s.blockedAt:Date.now(),sec=Math.max(0,Math.ceil((s.deadline-at)/1000));n.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');n.classList.toggle('urgent',sec<300);}
function tick(){const s=state.active;if(!s?.timed)return;if(!s.audioBlocked&&Date.now()>=s.deadline){if(s.kind==='full'&&s.phase==='listening'){readingPhase(true);if(Date.now()>=s.deadline)finish(true);}else finish(true);return;}if(s.strict&&s.phase==='listening'&&!s.audioBlocked){const elapsed=Date.now()-s.listenStart;const index=s.plan.findIndex(p=>elapsed<p.until);if(index>=0&&index!==s.track){stopAudio();s.track=index;s.index=s.plan[index].first;save();if(route==='session')renderListeningExam();}}updateTimer();updateExamCue();}
function stopAudio(){audioToken++;examSpeechToken++;examUtterance=null;if('speechSynthesis'in window)speechSynthesis.cancel();const b=document.getElementById('audio-play');if(b){b.disabled=false;b.innerHTML=icon('play')+' Play audio';}const n=document.getElementById('audio-status');if(n)n.textContent='Browser voice · practice audio';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,s=state.active;if(a==='answer'&&s?.strict&&s.phase==='listening'){e.stopImmediatePropagation();const qid=b.dataset.qid;if(!s.plan[s.track].ids.includes(qid))return;s.answers[qid]=+b.dataset.index;save();const parent=b.closest('.answers');parent.querySelectorAll('[role=radio]').forEach(n=>n.setAttribute('aria-checked',String(n===b)));return;}if(['sound-check','exam-start','retry-exam-audio','leave-exam'].includes(a)){e.stopImmediatePropagation();if(a==='sound-check')soundCheck();if(a==='exam-start'&&audioChecked&&document.getElementById('audio-confirm').checked){examChoice=document.getElementById('exam-form').value;begin('full');}if(a==='retry-exam-audio')playExamTrack(true);if(a==='leave-exam')confirmAction('Leave the exam?','Your answers stay saved. The timer and Listening schedule will continue while you are away.',()=>go('#home'),'Leave exam');}},true);
document.addEventListener('change',e=>{if(e.target.id==='practice-count'){practiceSize=+e.target.value;renderPractice();}if(e.target.id==='practice-level'){practiceLevel=e.target.value;renderPractice();}if(e.target.id==='audio-confirm')document.getElementById('exam-start').disabled=!audioChecked||!e.target.checked;if(e.target.id==='exam-form')examChoice=e.target.value;});

document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case 'start':begin(b.dataset.kind);break;case 'part':begin('part',BANK.filter(q=>q.part===+id),'Part '+id+' · '+PARTS[id]);break;case 'filter':filter=id;renderPractice();break;case 'lesson-practice':{const l=LESSONS.find(x=>x.id===id);const set=ALL.filter(q=>q.topic===l.topic);begin('lesson',sample(set,Math.min(10,set.length)),l.title);break;}case 'learned':if(!state.learned.includes(id)){state.learned.push(id);touchDay();save();}renderLesson(id);toast('Lesson marked as read.');break;case 'answer':answer(+b.dataset.index);break;case 'check':checkAnswer();break;case 'jump':jump(+b.dataset.index);break;case 'previous':{const s=state.active;const list=allowed(s);jump(list[list.indexOf(s.index)-1]);break;}case 'next':next();break;case 'flag':{const s=state.active,qid=s.ids[s.index];s.flags=s.flags.includes(qid)?s.flags.filter(i=>i!==qid):[...s.flags,qid];save();renderSession();break;}case 'submit':askSubmit();break;case 'play':{const q=BY_ID[state.active?.ids[state.active.index]];if(q?.audio)speak(q.audio,+document.getElementById('audio-rate').value);break;}case 'stop-audio':stopAudio();break;case 'speak-word':{const w=WORDS.find(x=>x.id===id);if(w)speak(w.word+'. '+w.example);break;}case 'retry-misses':begin('review',sample(state.misses,15).map(id=>BY_ID[id]));break;case 'retry-result':{const s=state.result;begin('review',s.ids.filter(id=>s.answers[id]!==BY_ID[id].answer).map(id=>BY_ID[id]));break;}case 'reveal-word':flashRevealed=true;renderVocab();break;case 'next-word':flashIndex=(flashIndex+1)%flashPool.length;flashRevealed=false;stopAudio();renderVocab();break;case 'prev-word':flashIndex=Math.max(0,flashIndex-1);flashRevealed=false;stopAudio();renderVocab();break;case 'shuffle-words':flashPool=shuffle(flashPool);flashIndex=0;flashRevealed=false;renderVocab();break;case 'know-word':{const w=flashPool[flashIndex];if(state.known.includes(w.id)){state.known=state.known.filter(id=>id!==w.id);toast('Word returned to learning.');}else{state.known.push(w.id);touchDay();toast('Word marked remembered.');}save();renderVocab();break;}case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='english-progress-'+dayKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}case 'reset':confirmAction('Reset your progress?','This removes saved answers, sessions, words, and lesson history from this browser. Export your progress first if you want to keep a copy.',()=>{state=fresh();save();nav();renderProgress();toast('Your progress has been reset.');},'Reset progress');break;}});
document.addEventListener('change',e=>{if(e.target.id==='word-level'){level=e.target.value;flashPool=WORDS.filter(w=>level==='all'||w.level===level);flashIndex=0;flashRevealed=false;renderVocab();}});
document.addEventListener('keydown',e=>{const r=e.target.closest('[role="radio"]');if(!r||!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))return;const options=[...r.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]:not(:disabled)')];if(!options.length)return;e.preventDefault();const index=options.indexOf(r),delta=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;const next=options[(index+delta+options.length)%options.length];next.click();next.focus();});
window.addEventListener('hashchange',()=>{filter='all';setRoute();});window.addEventListener('pagehide',()=>{stopAudio();save();});
function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';const b=document.getElementById('theme-toggle');b.setAttribute('aria-label','Switch to '+(dark?'light':'dark')+' theme');b.setAttribute('title','Switch to '+(dark?'light':'dark')+' theme');b.innerHTML='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(dark?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>':'<path d="M20 15a9 9 0 0 1-11-11A9 9 0 1 0 20 15Z"/>')+'</svg><span>'+(dark?'Light':'Dark')+'</span>';}
document.getElementById('theme-toggle').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('eight-hundred-theme',theme);}catch{}updateThemeButton();});
updateThemeButton();
document.getElementById('today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
setRoute();
</script>
